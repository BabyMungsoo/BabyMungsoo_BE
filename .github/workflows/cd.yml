name: Backend CD

# main 에 push(= develop → main PR merge)되면 운영 서버에 무중단 배포한다.
#   1) build  : GitHub 호스팅 러너에서 테스트 → Docker 이미지 빌드 → GHCR 에 push
#   2) deploy : 운영 EC2 에 설치한 self-hosted 러너(라벨 emj-prod)가 이미지를 받아
#               infra/terraform/files/deploy.sh 로 블루-그린 전환
#
# 주의: 이 저장소는 공개 저장소다. self-hosted 러너는 이 워크플로의 deploy 잡에서만 쓴다.
#       pull_request 트리거로 self-hosted 러너를 쓰는 잡을 절대 만들지 않는다
#       (외부 fork PR 이 운영 서버에서 코드를 실행할 수 있게 된다).
on:
  push:
    branches:
      - main
  # 실패한 배포를 다시 돌리거나 같은 커밋을 재배포할 때 Actions 탭에서 수동 실행
  workflow_dispatch:

# 배포가 겹치지 않게 한 번에 하나만. 진행 중인 배포는 끝까지 마친다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # GHCR 이미지 이름은 소문자여야 한다
  IMAGE: ghcr.io/babymungsoo/babymungsoo_be

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: babymungsoo
          POSTGRES_USER: babymungsoo
          POSTGRES_PASSWORD: 1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U babymungsoo -d babymungsoo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/babymungsoo
      SPRING_DATASOURCE_USERNAME: babymungsoo
      SPRING_DATASOURCE_PASSWORD: 1234
      CLAUDE_API_KEY: test-key
      # CI에서는 실제 Claude API를 호출하지 않는다(과금·외부 의존 차단)
      CLAUDE_API_MOCK: true
      JWT_SECRET: babymungsoo-ci-test-jwt-secret-key-2026-long-enough
      JWT_ACCESS_TOKEN_EXPIRATION_MS: 3600000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, linux, emj-prod]
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      # 서버 설정 파일(compose·Caddyfile·deploy.sh)만 필요해서 infra 만 받는다
      - name: Checkout server files
        uses: actions/checkout@v7
        with:
          sparse-checkout: infra/terraform/files
          sparse-checkout-cone-mode: false

      - name: Pull image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE:${{ github.sha }}"
          docker logout ghcr.io

      # 러너 계정은 sudoers 로 이 스크립트 하나만 root 로 실행할 수 있다(README 참고)
      - name: Blue-green deploy
        run: |
          sudo /opt/emj/deploy.sh --sync "$GITHUB_WORKSPACE/infra/terraform/files" \
            "$IMAGE:${{ github.sha }}"
