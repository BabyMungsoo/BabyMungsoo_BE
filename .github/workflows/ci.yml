name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: babymungsoo
          POSTGRES_USER: babymungsoo
          POSTGRES_PASSWORD: 1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U babymungsoo -d babymungsoo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/babymungsoo
      SPRING_DATASOURCE_USERNAME: babymungsoo
      SPRING_DATASOURCE_PASSWORD: 1234
      CLAUDE_API_KEY: test-key
      # CI에서는 실제 Claude API를 호출하지 않는다(과금·외부 의존 차단)
      CLAUDE_API_MOCK: true
      JWT_SECRET: babymungsoo-ci-test-jwt-secret-key-2026-long-enough
      JWT_ACCESS_TOKEN_EXPIRATION_MS: 3600000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build