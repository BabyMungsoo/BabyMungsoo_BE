plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'babymungsoo'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Claude API 연동
    //
    // swagger-annotations 를 제외하는 이유:
    // 이 SDK 는 io.swagger.core.v3:swagger-annotations(2.2.31) 를 끌고 오는데,
    // springdoc 이 쓰는 swagger-annotations-jakarta(2.2.47) 와 클래스 이름이 완전히 같습니다.
    // 구버전이 클래스패스에서 이기면 Schema.$dynamicRef() 가 없어서
    // /api-docs 요청이 NoSuchMethodError 로 500 을 냅니다.
    implementation('com.anthropic:anthropic-java:2.34.0') {
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 임시 H2 DB
    runtimeOnly 'com.h2database:h2'

    // postgresql
    runtimeOnly 'org.postgresql:postgresql'

}

tasks.named('test') {
    useJUnitPlatform()
}
