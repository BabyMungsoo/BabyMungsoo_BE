# 서버의 /opt/emj 에 놓인다. 변수는 두 env 파일에서 온다.
#   .env          비밀값·설정 (user_data 가 만들고, deploy.sh 가 API_HOST 를 갱신)
#   release.env   배포 상태 (deploy.sh 가 관리: 색깔별 이미지, 현재 활성 색깔)
# deploy.sh 가 항상 `docker compose --env-file .env --env-file release.env` 로 부른다.
#
# 무중단 배포(블루-그린): api-blue / api-green 두 칸 중 하나에만 Caddy 가 트래픽을 보낸다.
# 새 버전은 쉬고 있는 칸에 띄우고, 헬스 체크가 통과하면 Caddy 연결만 바꾼 뒤 이전 칸을 내린다.
name: emj

x-api: &api
  restart: unless-stopped
  env_file: .env
  environment:
    FILE_UPLOAD_DIR: /app/uploads
    # 전환하는 동안 두 JVM 이 함께 뜬다. 2GB 서버에서 둘이 버티도록 컨테이너마다 상한을 건다
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
  mem_limit: 768m
  # prod 프로필의 graceful 종료(최대 30초)가 끝날 때까지 기다린다
  stop_grace_period: 40s
  volumes:
    - /opt/emj/data/uploads:/app/uploads
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /opt/emj/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 헬스 체크는 서버 안에서 curl 로 한다. 외부에는 열리지 않도록 127.0.0.1 에만 묶는다.
  api-blue:
    <<: *api
    image: ${API_BLUE_IMAGE:-emj-api:local}
    ports:
      - "127.0.0.1:18081:8080"

  api-green:
    <<: *api
    image: ${API_GREEN_IMAGE:-emj-api:local}
    ports:
      - "127.0.0.1:18082:8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOST: ${API_HOST}
    volumes:
      # Caddyfile 과 upstream.caddy(지금 트래픽을 받을 칸)를 함께 둔다.
      # 디렉터리째 마운트해야 deploy.sh 가 upstream.caddy 를 바꿔도 컨테이너에 보인다.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
