# 운영(AWS) 프로필. 병원 시드 러너는 dev 전용이라 여기서는 돌지 않는다.
# 배포 후 관리자 계정으로 POST /api/v1/admin/hospitals/seed-nationwide 를 한 번 호출할 것.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 마이그레이션 도구가 없어 빈 DB 에 스키마를 만들 방법이 이것뿐이다.
      # Flyway 등을 도입하면 validate 로 바꾼다.
      ddl-auto: update
    show-sql: false

  lifecycle:
    # graceful 종료 대기 상한. docker compose 의 stop_grace_period(40s)보다 짧게 둔다
    timeout-per-shutdown-phase: 30s

server:
  # Caddy 뒤에서 돌므로 X-Forwarded-* 를 믿어야 https 기준으로 URL 을 만든다.
  forward-headers-strategy: framework
  # 무중단 배포: 이전 버전 컨테이너를 내릴 때 처리 중인 요청은 끝까지 마치고 종료한다
  shutdown: graceful

claude:
  api:
    # 운영은 실호출이 기본. 리허설 중 과금을 막으려면 CLAUDE_API_MOCK=true 로 덮어쓴다.
    mock: ${CLAUDE_API_MOCK:false}

file:
  upload-dir: ${FILE_UPLOAD_DIR:/app/uploads}
