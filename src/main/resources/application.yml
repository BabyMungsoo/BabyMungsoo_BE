claude:
  api:
    # 실제 키는 CLAUDE_API_KEY 환경변수로 주입한다. 설정 파일에 평문으로 저장하지 않는다.
    # 기본값은 Mock 단계에서 분석 흐름을 테스트할 수 있도록 둔 자리표시자이며,
    # 실제 API 연동 시 ${CLAUDE_API_KEY:} 로 바꿔 키 미설정을 정확히 감지하도록 한다.
    key: ${CLAUDE_API_KEY:mock-placeholder}
    model: claude-sonnet-5

spring:
  config:
    import: optional:file:.env[.properties]

  main:
    allow-bean-definition-overriding: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /api-docs