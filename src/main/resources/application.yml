jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}

admin:
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}
  name: ${ADMIN_NAME:관리자}

claude:
  api:
    # 실제 키는 CLAUDE_API_KEY 환경변수로 주입한다. 설정 파일에 평문으로 저장하지 않는다.
    # 기본값을 비워 두어 키 미설정을 AI_API_KEY_NOT_CONFIGURED로 정확히 감지한다.
    key: ${CLAUDE_API_KEY:}
    model: claude-sonnet-5
    # true면 StubTriageAnalyzer(실호출·과금 없음), false면 ClaudeTriageAnalyzer.
    # 구현체는 @ConditionalOnProperty로 전환하며 matchIfMissing을 쓰지 않으므로,
    # 이 속성이 없으면 두 빈이 모두 등록되지 않아 기동에 실패한다. 반드시 유지할 것.
    # 기본값 true로 개발 중 의도치 않은 과금을 막고, 운영은 prod 설정에서 false로 고정한다.
    mock: ${CLAUDE_API_MOCK:true}

kakao:
  # 카카오 로컬(장소검색) REST API 키. 서버 비밀값이므로 KAKAO_REST_API_KEY 환경변수로 주입한다.
  # 비어 있으면 시드 호출 시 KAKAO_API_KEY_NOT_CONFIGURED로 감지된다.
  rest-api-key: ${KAKAO_REST_API_KEY:}

spring:
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLE:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS_ENABLE:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  config:
    import: optional:file:.env[.properties]

  main:
    allow-bean-definition-overriding: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

recovery:
  mail-from: ${MAIL_FROM:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /api-docs
